<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="970" viewBox="0 0 2000 970" role="img" aria-labelledby="title desc">
  <title id="title">Gate 8 benchmark results</title>
  <desc id="desc">A three-panel chart of verified fixes by task family, total cost per arm, and diagnostic versus protected verification results for plain retry.</desc>
  <rect width="2000" height="970" fill="#f8f8f5"/>
  <rect width="2000" height="5" fill="#4e9de6"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="43" fill="#367fc9" font-size="15" font-weight="700" letter-spacing="2.4">GATE 8 / HELD-OUT FEASIBILITY EVALUATION</text>
    <text x="52" y="96" fill="#34383b" font-size="36" font-weight="600" letter-spacing="-1">Verified fixes across four held-out tasks.</text>
    <text x="1948" y="94" fill="#777a7c" font-size="16" letter-spacing="1.5" text-anchor="end">60 RUNS · 4 TASKS · 5 REPEATS · SAME MODEL</text>
  </g>

  <g transform="translate(0 50)">
  <!-- Verified fixes by family -->
  <rect x="40" y="112" width="825" height="680" fill="#fbfbf9" stroke="#deded8" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="164" fill="#367fc9" font-size="14" font-weight="700" letter-spacing="2.4">01 / OUTCOME</text>
    <text x="72" y="205" fill="#34383b" font-size="29" font-weight="600">Verified fixes by family</text>
    <text x="72" y="237" fill="#777a7c" font-size="18">Counted only after protected verification</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#62676a">
    <rect x="76" y="270" width="16" height="16" fill="#8c918f"/><text x="102" y="284">Plain retry</text>
    <rect x="242" y="270" width="16" height="16" fill="#a8784d"/><text x="268" y="284">Fixed fallback</text>
    <rect x="438" y="270" width="16" height="16" fill="#4e9de6"/><text x="464" y="284">Reflex + memory</text>
  </g>
  <g stroke="#deded8" stroke-width="1.5">
    <line x1="142" y1="324" x2="832" y2="324"/><line x1="142" y1="385" x2="832" y2="385"/>
    <line x1="142" y1="446" x2="832" y2="446"/><line x1="142" y1="507" x2="832" y2="507"/>
    <line x1="142" y1="568" x2="832" y2="568"/><line x1="142" y1="629" x2="832" y2="629"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#777a7c" text-anchor="end">
    <text x="123" y="330">10</text><text x="123" y="391">8</text><text x="123" y="452">6</text>
    <text x="123" y="513">4</text><text x="123" y="574">2</text><text x="123" y="635">0</text>
  </g>
  <line x1="142" y1="629" x2="832" y2="629" stroke="#bfc2bd" stroke-width="2"/>
  <!-- Family A: 0, 4, 5 out of 10 -->
  <rect x="270" y="626" width="44" height="3" fill="#8c918f"/>
  <rect x="326" y="507" width="44" height="122" fill="#a8784d"/>
  <rect x="382" y="477" width="44" height="152" fill="#4e9de6"/>
  <!-- Family B: 0, 0, 8 out of 10 -->
  <rect x="570" y="626" width="44" height="3" fill="#8c918f"/>
  <rect x="626" y="626" width="44" height="3" fill="#a8784d"/>
  <rect x="682" y="385" width="44" height="244" fill="#4e9de6"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">
    <text x="292" y="611" fill="#62676a">0/10</text><text x="348" y="493" fill="#62676a">4/10</text><text x="404" y="463" fill="#367fc9" font-weight="700">5/10</text>
    <text x="592" y="611" fill="#62676a">0/10</text><text x="648" y="611" fill="#62676a">0/10</text><text x="704" y="371" fill="#367fc9" font-weight="700">8/10</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="348" y="670" fill="#4b5052" font-size="18" font-weight="600">FAMILY A</text>
    <text x="348" y="696" fill="#858983" font-size="15">Oscillation</text>
    <text x="648" y="670" fill="#4b5052" font-size="18" font-weight="600">FAMILY B</text>
    <text x="648" y="696" fill="#858983" font-size="15">Semantic repetition</text>
  </g>

  <!-- Cost and result -->
  <rect x="890" y="112" width="480" height="680" fill="#fbfbf9" stroke="#deded8" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="922" y="164" fill="#367fc9" font-size="14" font-weight="700" letter-spacing="2.4">02 / EFFICIENCY</text>
    <text x="922" y="205" fill="#34383b" font-size="27" font-weight="600">Run cost and fixes</text>
    <text x="922" y="237" fill="#777a7c" font-size="18">Total spend · 20 runs per arm</text>
  </g>
  <g stroke="#deded8" stroke-width="1.5">
    <line x1="975" y1="324" x2="1340" y2="324"/><line x1="975" y1="411" x2="1340" y2="411"/>
    <line x1="975" y1="498" x2="1340" y2="498"/><line x1="975" y1="585" x2="1340" y2="585"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#777a7c" text-anchor="end">
    <text x="962" y="330">$0.06</text><text x="962" y="417">$0.04</text><text x="962" y="504">$0.02</text><text x="962" y="591">$0</text>
  </g>
  <line x1="975" y1="585" x2="1340" y2="585" stroke="#bfc2bd" stroke-width="2"/>
  <rect x="1002" y="303" width="62" height="282" fill="#8c918f"/>
  <rect x="1120" y="415" width="62" height="170" fill="#a8784d"/>
  <rect x="1238" y="426" width="62" height="159" fill="#4e9de6"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="600">
    <text x="1033" y="289" fill="#555a5d">$0.0647</text>
    <text x="1151" y="401" fill="#555a5d">$0.0391</text>
    <text x="1269" y="412" fill="#367fc9">$0.0366</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="1033" y="622" fill="#555a5d" font-size="15">Plain retry</text>
    <text x="1151" y="622" fill="#555a5d" font-size="15">Fallback</text>
    <text x="1269" y="622" fill="#367fc9" font-size="15" font-weight="600">Memory</text>
    <text x="1033" y="674" fill="#858983" font-size="14">0 fixed</text>
    <text x="1151" y="674" fill="#858983" font-size="14">4 · $0.0098 / fix</text>
    <text x="1269" y="674" fill="#367fc9" font-size="14" font-weight="600">13 · $0.0028 / fix</text>
  </g>

  <!-- Diagnostics versus verified fixes -->
  <rect x="1395" y="112" width="565" height="680" fill="#fbfbf9" stroke="#deded8" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="1427" y="164" fill="#367fc9" font-size="14" font-weight="700" letter-spacing="2.4">03 / VERIFICATION</text>
    <text x="1427" y="205" fill="#34383b" font-size="27" font-weight="600">Visible ≠ verified</text>
    <text x="1427" y="237" fill="#777a7c" font-size="18">Plain retry · family A · 10 runs</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="1427" y="326" fill="#555a5d" font-size="19" font-weight="600">Passed diagnostics</text>
    <text x="1924" y="326" fill="#a8784d" font-size="20" font-weight="700" text-anchor="end">9 / 10</text>
    <rect x="1427" y="344" width="497" height="22" fill="#e8e4de"/>
    <rect x="1427" y="344" width="447" height="22" fill="#a8784d"/>
    <text x="1427" y="464" fill="#555a5d" font-size="19" font-weight="600">Passed protected verification</text>
    <text x="1924" y="464" fill="#367fc9" font-size="20" font-weight="700" text-anchor="end">0 / 10</text>
    <rect x="1427" y="482" width="497" height="22" fill="#e2eaf0"/>
    <line x1="1428" y1="482" x2="1428" y2="504" stroke="#367fc9" stroke-width="3"/>
  </g>
  <line x1="1427" y1="548" x2="1924" y2="548" stroke="#deded8" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="1427" y="601" fill="#777a7c" font-size="16" letter-spacing="1.2">ACTUAL VERIFIED FIXES</text>
    <text x="1427" y="686" fill="#367fc9" font-size="64" font-weight="600" letter-spacing="-3">0<tspan fill="#777a7c" font-size="31" font-weight="400"> / 10</tspan></text>
  </g>

  </g>

  <line x1="52" y1="876" x2="1948" y2="876" stroke="#deded8" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#777a7c" font-size="16" letter-spacing=".3">
    <text x="52" y="912"><tspan fill="#a8784d" font-weight="700" letter-spacing="1.6">FEASIBILITY</tspan><tspan> · 2 tasks per family × 5 repeats (not independent; effective N = 2 per family)</tspan></text>
    <text x="52" y="940" font-size="14">Verified = diagnostics + protected tests + static gaming check.</text>
  </g>
</svg>
