<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" fill="none">
  <!-- Frame: 48x48 pixel grid -->
  <g transform="translate(0, 0)">
    <!-- Top border -->
    <rect x="0" y="0" width="6" height="6" fill="#111111"/>
    <rect x="6" y="0" width="6" height="6" fill="#111111"/>
    <rect x="12" y="0" width="6" height="6" fill="#111111"/>
    <rect x="18" y="0" width="6" height="6" fill="#111111"/>
    <rect x="24" y="0" width="6" height="6" fill="#111111"/>
    <rect x="30" y="0" width="6" height="6" fill="#111111"/>
    <rect x="36" y="0" width="6" height="6" fill="#111111"/>
    <rect x="42" y="0" width="6" height="6" fill="#111111"/>
    
    <!-- Left border -->
    <rect x="0" y="6" width="6" height="6" fill="#111111"/>
    <rect x="0" y="12" width="6" height="6" fill="#111111"/>
    <rect x="0" y="18" width="6" height="6" fill="#111111"/>
    <rect x="0" y="24" width="6" height="6" fill="#111111"/>
    <rect x="0" y="30" width="6" height="6" fill="#111111"/>
    <rect x="0" y="36" width="6" height="6" fill="#111111"/>
    
    <!-- Right border -->
    <rect x="42" y="6" width="6" height="6" fill="#111111"/>
    <rect x="42" y="12" width="6" height="6" fill="#111111"/>
    <rect x="42" y="18" width="6" height="6" fill="#111111"/>
    <rect x="42" y="24" width="6" height="6" fill="#111111"/>
    <rect x="42" y="30" width="6" height="6" fill="#111111"/>
    <rect x="42" y="36" width="6" height="6" fill="#111111"/>
    
    <!-- Bottom border -->
    <rect x="6" y="42" width="6" height="6" fill="#111111"/>
    <rect x="12" y="42" width="6" height="6" fill="#111111"/>
    <rect x="18" y="42" width="6" height="6" fill="#111111"/>
    <rect x="24" y="42" width="6" height="6" fill="#111111"/>
    <rect x="30" y="42" width="6" height="6" fill="#111111"/>
    <rect x="36" y="42" width="6" height="6" fill="#111111"/>
    <rect x="42" y="42" width="6" height="6" fill="#111111"/>
    
    <!-- "R" shape (pixel art) -->
    <!-- Vertical stem -->
    <rect x="12" y="12" width="6" height="6" fill="#111111"/>
    <rect x="12" y="18" width="6" height="6" fill="#111111"/>
    <rect x="12" y="24" width="6" height="6" fill="#111111"/>
    <rect x="12" y="30" width="6" height="6" fill="#111111"/>
    
    <!-- Top curve -->
    <rect x="18" y="12" width="6" height="6" fill="#111111"/>
    <rect x="24" y="12" width="6" height="6" fill="#111111"/>
    <rect x="30" y="18" width="6" height="6" fill="#111111"/>
    
    <!-- Middle connection -->
    <rect x="18" y="24" width="6" height="6" fill="#111111"/>
    <rect x="24" y="24" width="6" height="6" fill="#111111"/>
    
    <!-- Leg -->
    <rect x="24" y="30" width="6" height="6" fill="#111111"/>
    <rect x="30" y="36" width="6" height="6" fill="#111111"/>
  </g>
  
  <!-- Text: REFLEX HARNESS -->
  <text x="64" y="26" font-family="system-ui,-apple-system,'Segoe UI','Geist',sans-serif" font-size="20" font-weight="800" letter-spacing="-0.03em" fill="#111111">REFLEX</text>
  <text x="64" y="40" font-family="system-ui,-apple-system,'Segoe UI','Geist',sans-serif" font-size="10" font-weight="500" letter-spacing="0.18em" fill="#64748B">HARNESS</text>
</svg>
